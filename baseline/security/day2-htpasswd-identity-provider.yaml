# HTPasswd identity provider "htpasswd" with the cluster administrator ocpadmin.
#
# The users file is not in Git: it is read with a hub template from the Secret
# rhacm-policies/htpasswd-users (key htpasswd) on the hub, and ACM encrypts the
# value before it reaches the managed cluster. Create or update it on the hub with
# bcrypt hashes (htpasswd -B), see baseline/security/README.md:
#
#   htpasswd -cbB users.htpasswd ocpadmin '<password>'
#   oc create secret generic htpasswd-users -n rhacm-policies \
#     --from-file=htpasswd=users.htpasswd --dry-run=client -o yaml | oc apply -f -
#
# Every cluster this policy is placed on gets the same users. Until the hub Secret
# exists the template fails and the policy is NonCompliant, so day2-kubeadmin-removed,
# which depends on it, keeps kubeadmin.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: day2-htpasswd-identity-provider
  namespace: rhacm-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: AC Access Control
    policy.open-cluster-management.io/controls: AC-2 Account Management
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: htpasswd-identity-provider
        spec:
          severity: high
          remediationAction: enforce
          object-templates:
            - complianceType: musthave
              recordDiff: None
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: htpasswd-users
                  namespace: openshift-config
                type: Opaque
                data:
                  htpasswd: '{{hub fromSecret "rhacm-policies" "htpasswd-users" "htpasswd" hub}}'
            # musthave merges into the list: other identity providers are kept.
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: OAuth
                metadata:
                  name: cluster
                spec:
                  identityProviders:
                    - name: htpasswd
                      type: HTPasswd
                      mappingMethod: claim
                      htpasswd:
                        fileData:
                          name: htpasswd-users
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: ocpadmin-cluster-admin
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: cluster-admin
                subjects:
                  - apiGroup: rbac.authorization.k8s.io
                    kind: User
                    name: ocpadmin
    # Report-only: the OAuth server has rolled out the new identity provider.
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: htpasswd-identity-provider
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: htpasswd-identity-provider-ready
        spec:
          severity: medium
          remediationAction: inform
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: ClusterOperator
                metadata:
                  name: authentication
                status:
                  conditions:
                    - type: Progressing
                      status: "False"
                    - type: Available
                      status: "True"
