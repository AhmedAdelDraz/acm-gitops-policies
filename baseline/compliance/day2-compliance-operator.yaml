apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: day2-compliance-operator
  namespace: rhacm-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CA Assessment, Authorization, and Monitoring
    policy.open-cluster-management.io/controls: CA-7 Continuous Monitoring
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # The scanner pods run privileged on every node.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: compliance-operator-namespace
        spec:
          severity: high
          remediationAction: enforce
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: openshift-compliance
                  labels:
                    openshift.io/cluster-monitoring: "true"
                    pod-security.kubernetes.io/enforce: privileged
    # Installed in its own namespace, watching only that namespace (the layout
    # Red Hat documents). Channel pinned for the same reason as the other operators.
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: compliance-operator-namespace
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: install-compliance-operator
        spec:
          severity: high
          remediationAction: enforce
          complianceType: musthave
          operatorGroup:
            name: openshift-compliance
            namespace: openshift-compliance
            targetNamespaces:
              - openshift-compliance
          subscription:
            name: compliance-operator
            namespace: openshift-compliance
            channel: stable
            source: redhat-operators
            sourceNamespace: openshift-marketplace
          upgradeApproval: Automatic
    # Node scans run per MachineConfigPool role. The "default" ScanSetting only
    # scans master and worker, so infra nodes that do not also carry the worker
    # label (3 masters + 3 infra, no workers) would never be scanned. The roles
    # are therefore taken from the nodes each cluster actually has. Every other
    # field matches the "default" ScanSetting: daily at 01:00, scanner tolerates
    # all taints, raw results on a 1Gi PVC from the default StorageClass.
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1beta1
          kind: OperatorPolicy
          name: install-compliance-operator
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: compliance-pci-dss-scansetting
        spec:
          severity: high
          remediationAction: enforce
          object-templates-raw: |
            {{- $roles := list "master" }}
            {{- if gt (len (lookup "v1" "Node" "" "" "node-role.kubernetes.io/worker").items) 0 }}{{ $roles = append $roles "worker" }}{{ end }}
            {{- if gt (len (lookup "v1" "Node" "" "" "node-role.kubernetes.io/infra" "!node-role.kubernetes.io/worker").items) 0 }}{{ $roles = append $roles "infra" }}{{ end }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: compliance.openshift.io/v1alpha1
                kind: ScanSetting
                metadata:
                  name: pci-dss
                  namespace: openshift-compliance
                roles: {{ $roles | toRawJson }}
                schedule: "0 1 * * *"
                timeout: 30m
                maxRetryOnTimeout: 3
                strictNodeScan: true
                showNotApplicable: false
                scanTolerations:
                  - operator: Exists
                rawResultStorage:
                  size: 1Gi
                  rotation: 3
                  pvAccessModes:
                    - ReadWriteOnce
                  nodeSelector:
                    node-role.kubernetes.io/master: ""
                  tolerations:
                    - key: node-role.kubernetes.io/master
                      operator: Exists
                      effect: NoSchedule
    # PCI-DSS v4.0 is the profile set that fits the banking sector: the platform
    # profile checks cluster configuration, the node profile checks every node.
    # Remediations are not applied automatically; review them first (many trigger
    # node reboots). Results are reported by day2-compliance-pci-dss-results.
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: compliance-pci-dss-scansetting
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: compliance-pci-dss-scan
        spec:
          severity: high
          remediationAction: enforce
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: compliance.openshift.io/v1alpha1
                kind: ScanSettingBinding
                metadata:
                  name: pci-dss
                  namespace: openshift-compliance
                profiles:
                  - apiGroup: compliance.openshift.io/v1alpha1
                    kind: Profile
                    name: ocp4-pci-dss-4-0
                  - apiGroup: compliance.openshift.io/v1alpha1
                    kind: Profile
                    name: ocp4-pci-dss-node-4-0
                settingsRef:
                  apiGroup: compliance.openshift.io/v1alpha1
                  kind: ScanSetting
                  name: pci-dss
