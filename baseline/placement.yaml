apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-openshift-day2
  namespace: rhacm-policies
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: vendor
              operator: In
              values: ["OpenShift"]
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-openshift-day2
  namespace: rhacm-policies
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: placement-openshift-day2
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: PolicySet
    name: baseline-security
  - apiGroup: policy.open-cluster-management.io
    kind: PolicySet
    name: baseline-compliance
  - apiGroup: policy.open-cluster-management.io
    kind: PolicySet
    name: baseline-pipelines
  - apiGroup: policy.open-cluster-management.io
    kind: PolicySet
    name: baseline-operators
  - apiGroup: policy.open-cluster-management.io
    kind: PolicySet
    name: baseline-infrastructure
  - apiGroup: policy.open-cluster-management.io
    kind: PolicySet
    name: baseline-cluster-settings
