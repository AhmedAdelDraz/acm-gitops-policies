apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: day2-ipsec-full-encryption
  namespace: rhacm-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: SC System and Communications Protection
    policy.open-cluster-management.io/controls: SC-8 Transmission Confidentiality and Integrity
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    # Encrypts all east-west pod traffic between nodes. Enabling it rolls out the
    # ovnkube pods and lowers the effective MTU by 46 bytes, so enforce it in a
    # maintenance window (and after day2-jumbo-frames-mtu if both are used).
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: ovn-ipsec-full
        spec:
          severity: high
          remediationAction: inform
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operator.openshift.io/v1
                kind: Network
                metadata:
                  name: cluster
                spec:
                  defaultNetwork:
                    ovnKubernetesConfig:
                      ipsecConfig:
                        mode: Full
