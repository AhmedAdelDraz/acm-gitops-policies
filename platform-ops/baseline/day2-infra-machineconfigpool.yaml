apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: day2-infra-machineconfigpool
  namespace: rhacm-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    # Nodes labelled node-role.kubernetes.io/infra move into their own pool. The pool
    # still renders worker MachineConfigs, plus any MachineConfig with role=infra.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: infra-machineconfigpool
        spec:
          severity: high
          remediationAction: inform
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: machineconfiguration.openshift.io/v1
                kind: MachineConfigPool
                metadata:
                  name: infra
                spec:
                  machineConfigSelector:
                    matchExpressions:
                      - key: machineconfiguration.openshift.io/role
                        operator: In
                        values: ["worker", "infra"]
                  nodeSelector:
                    matchLabels:
                      node-role.kubernetes.io/infra: ""
