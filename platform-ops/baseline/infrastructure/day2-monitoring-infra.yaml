apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: day2-monitoring-infra
  namespace: rhacm-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # Platform monitoring baseline: user workload monitoring on, 15 days of metrics.
    # Decided on each managed cluster:
    #   - infra nodes present: every component moves to them.
    #   - default StorageClass present: Prometheus and Alertmanager get persistent
    #     storage from it (otherwise they keep emptyDir and would stay Pending on PVCs).
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: cluster-monitoring-config
        spec:
          severity: medium
          remediationAction: enforce
          object-templates-raw: |
            {{- $infra := gt (len (lookup "v1" "Node" "" "" "node-role.kubernetes.io/infra").items) 0 }}
            {{- $pvc := false }}
            {{- range (lookup "storage.k8s.io/v1" "StorageClass" "" "").items }}
            {{- range $k, $v := .metadata.annotations }}{{ if and (eq $k "storageclass.kubernetes.io/is-default-class") (eq $v "true") }}{{ $pvc = true }}{{ end }}{{ end }}
            {{- end }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: cluster-monitoring-config
                  namespace: openshift-monitoring
                data:
                  config.yaml: |
                    enableUserWorkload: true
                    alertmanagerMain:
                      enabled: true
                      {{- if $infra }}
                      nodeSelector:
                        node-role.kubernetes.io/infra: ""
                      tolerations:
                        - key: node-role.kubernetes.io/infra
                          operator: Exists
                      {{- end }}
                      {{- if $pvc }}
                      volumeClaimTemplate:
                        spec:
                          resources:
                            requests:
                              storage: 5Gi
                      {{- end }}
                    prometheusK8s:
                      retention: 15d
                      {{- if $infra }}
                      nodeSelector:
                        node-role.kubernetes.io/infra: ""
                      tolerations:
                        - key: node-role.kubernetes.io/infra
                          operator: Exists
                      {{- end }}
                      {{- if $pvc }}
                      volumeClaimTemplate:
                        spec:
                          resources:
                            requests:
                              storage: 100Gi
                      {{- end }}
                    {{- if $infra }}
                    {{- range list "prometheusOperator" "metricsServer" "kubeStateMetrics" "telemeterClient" "openshiftStateMetrics" "thanosQuerier" "monitoringPlugin" }}
                    {{ . }}:
                      nodeSelector:
                        node-role.kubernetes.io/infra: ""
                      tolerations:
                        - key: node-role.kubernetes.io/infra
                          operator: Exists
                    {{- end }}
                    {{- end }}
