apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: day2-oauth-token-duration
  namespace: rhacm-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: AC Access Control
    policy.open-cluster-management.io/controls: AC-12 Session Termination
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # OAuth access tokens expire after 1 hour (default 24h). Applies to tokens
    # issued after the change; existing tokens keep their original lifetime.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: oauth-access-token-max-age
        spec:
          severity: medium
          remediationAction: enforce
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: OAuth
                metadata:
                  name: cluster
                spec:
                  tokenConfig:
                    accessTokenMaxAgeSeconds: 3600
