apiVersion: policy.open-cluster-management.io/v1beta1
kind: PolicySet
metadata:
  name: openshift-day2-operations
  namespace: rhacm-policies
spec:
  description: Common day-2 baseline for all OpenShift clusters (no cluster-specific parameters)
  policies:
    - day2-etcd-encryption
    - day2-disable-self-provisioner
    - day2-console-banner
    - day2-disable-remote-health-reporting
    - day2-infra-machineconfigpool
    - day2-ingress-infra
    - day2-monitoring-infra
    - day2-image-registry-infra
    - day2-gatekeeper-operator
    - day2-descheduler-operator
    - day2-openshift-pipelines
    - day2-kubeadmin-removed
    - day2-oauth-token-duration
    - day2-compliance-operator
    - day2-compliance-pci-dss-results
    - day2-default-network-policies
