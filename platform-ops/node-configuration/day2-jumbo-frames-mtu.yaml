apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: day2-jumbo-frames-mtu
  namespace: rhacm-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-6 Configuration Settings
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    # Sets MTU 9000 on the node uplink (ens192 on vSphere; change the interface name
    # for other platforms). This is only half of an MTU migration and must stay in
    # inform until the cluster network migration has been started:
    #
    #   1. oc get clusteroperators            # all Available, none Progressing/Degraded
    #   2. oc patch Network.operator.openshift.io cluster --type=merge --patch \
    #        '{"spec":{"migration":{"mtu":{"network":{"from":1400,"to":8854},"machine":{"to":9000}}}}}'
    #   3. Enforce this policy from ACM and wait for oc get mcp to show UPDATED=True.
    #   4. oc patch Network.operator.openshift.io cluster --type=merge --patch \
    #        '{"spec":{"migration":null,"defaultNetwork":{"ovnKubernetesConfig":{"mtu":8854}}}}'
    #
    # 8854 = 9000 - 100 (OVN-Kubernetes Geneve) - 46 (IPsec).
    # Nodes reboot several times; do not apply other MachineConfig policies meanwhile.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: mtu-master
        spec:
          severity: high
          remediationAction: inform
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: machineconfiguration.openshift.io/v1
                kind: MachineConfig
                metadata:
                  name: 01-master-interface-mtu
                  labels:
                    machineconfiguration.openshift.io/role: master
                spec:
                  config:
                    ignition:
                      version: 3.4.0
                    storage:
                      files:
                        - path: /etc/NetworkManager/conf.d/99-ens192-mtu.conf
                          mode: 384
                          contents:
                            source: data:,%5Bconnection-ens192-mtu%5D%0Amatch-device%3Dinterface-name%3Aens192%0Aethernet.mtu%3D9000%0A
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: mtu-infra
        spec:
          severity: high
          remediationAction: inform
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: machineconfiguration.openshift.io/v1
                kind: MachineConfig
                metadata:
                  name: 01-infra-interface-mtu
                  labels:
                    machineconfiguration.openshift.io/role: infra
                spec:
                  config:
                    ignition:
                      version: 3.4.0
                    storage:
                      files:
                        - path: /etc/NetworkManager/conf.d/99-ens192-mtu.conf
                          mode: 384
                          contents:
                            source: data:,%5Bconnection-ens192-mtu%5D%0Amatch-device%3Dinterface-name%3Aens192%0Aethernet.mtu%3D9000%0A
