apiVersion: policy.open-cluster-management.io/v1beta1
kind: PolicySet
metadata:
  name: openshift-day2-operations
  namespace: rhacm-policies
spec:
  description: Common day-2 operations baseline for OpenShift clusters
  policies:
    - day2-cluster-monitoring
    - day2-image-pruner
    - day2-etcd-encryption
    - day2-compliance-operator
    - day2-certificate-expiry
    - day2-kubeadmin-removed
---
apiVersion: policy.open-cluster-management.io/v1beta1
kind: PolicySet
metadata:
  name: openshift-gcp-logging
  namespace: rhacm-policies
spec:
  description: Log forwarding to Google Cloud Logging with Workload Identity Federation for OpenShift on GCP
  policies:
    - day2-logging-operators
    - day2-logging-gcp-forwarder
