# Opt-in: not deployed anywhere by default. Label a managed cluster with
# gcp-filestore=enabled to install the Filestore CSI driver on it, after the GCP
# service account in the header of day2-gcp-filestore-driver.yaml exists.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-openshift-gcp-storage
  namespace: rhacm-policies
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: vendor
              operator: In
              values: ["OpenShift"]
            - key: cloud
              operator: In
              values: ["Google"]
            - key: gcp-filestore
              operator: In
              values: ["enabled"]
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-openshift-gcp-storage
  namespace: rhacm-policies
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: placement-openshift-gcp-storage
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: PolicySet
    name: openshift-gcp-storage
